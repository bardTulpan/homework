<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ДЗ Динамический список</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1 id="list-title">Мой список</h1>
        
        <div class="list-container">
            <ul class="styled-list" id="dynamic-list"></ul>
            <p class="empty-message" id="empty-message">Список пуст</p>
        </div>
        
        <div class="controls">
            <button id="add-item-btn">Добавить элемент</button>
            <button id="toggle-theme-btn">Сменить тему</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
